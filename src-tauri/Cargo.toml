[package]
name = "hoverpill"
version = "0.1.0"
description = "A Dynamic Island-style smart notch for Windows and Linux"
edition = "2021"

[workspace]
members = ["crates/media", "crates/notify"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }
httparse = "1"
getrandom = "0.4"
hoverpill-media = { path = "crates/media" }
hoverpill-notify = { path = "crates/notify" }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# Google Calendar and Sign in with ChatGPT: HTTPS, PKCE, and verifying OpenAI's ID token.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
futures-util = "0.3"
sha2 = "0.10"
base64 = "0.22"
jsonwebtoken = "9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
