[package]
name = "hoverpill"
version = "0.2.0"
description = "A Dynamic Island-style smart notch for Windows and Linux"
edition = "2021"

[workspace]
members = ["crates/media", "crates/notify"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }
httparse = "1"
getrandom = "0.4"
hoverpill-media = { path = "crates/media" }
hoverpill-notify = { path = "crates/notify" }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# Google Calendar and Sign in with ChatGPT: HTTPS, PKCE, and verifying OpenAI's ID token.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
futures-util = "0.3"
sha2 = "0.11"
base64 = "0.22"
# Since 10, the crypto backend must be chosen explicitly; without one, verifying a token panics.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# GTK/GDK for shaping the X input region under XWayland (see `set_input_region` in notch.rs),
# and libX11 (through x11-dl) to spot a fullscreen app worth hiding behind (see
# `fullscreen_app_on`).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
x11-dl = "2"
# Client for the GNOME Shell extension that reports fullscreen state for native
# Wayland apps (see `shellext.rs`).
zbus = "5"

[profile.release]
lto = true
codegen-units = 1
strip = true
