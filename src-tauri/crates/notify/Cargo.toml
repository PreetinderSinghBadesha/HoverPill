[package]
name = "hoverpill-notify"
version = "0.1.0"
description = "Mirror other apps' desktop notifications (UserNotificationListener on Windows, D-Bus monitor on Linux)"
edition = "2021"

[dependencies]
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "ApplicationModel",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
  "UI_Notifications",
  "UI_Notifications_Management",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
] }
windows-future = "0.3"
winreg = "0.56"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
png = "0.18"
