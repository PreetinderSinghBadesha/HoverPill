<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 400" width="1560" height="400">
  <title>HoverPill</title>
  <!-- The mark, then the name in the same face the notch uses (Segoe UI Variable Display). -->
  <svg x="20" y="20" width="360" height="360" viewBox="64 64 896 896">
  
  <defs>
    <!-- The "wallpaper", in the colour the notch takes from whatever is playing. -->
    <linearGradient id="wallpaper" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FF5C8A"/>
      <stop offset="0.55" stop-color="#9B5CFF"/>
      <stop offset="1" stop-color="#5B4BFF"/>
    </linearGradient>
    <!-- The cover inside the notch: a pale version of the same colours. -->
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD3E2"/>
      <stop offset="1" stop-color="#C8B8FF"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <clipPath id="tile">
      <rect x="64" y="64" width="896" height="896" rx="140"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="64" y="64" width="896" height="896" fill="url(#wallpaper)"/>

    <!-- It hovers: a soft shadow under the notch. -->
    <ellipse cx="512" cy="336" rx="250" ry="44" fill="#1B0B3A" opacity="0.35" filter="url(#shadow)"/>

    <!-- The notch: flat against the screen's top edge, concave ears where it meets the edge,
         a fully round bottom. -->
    <path fill="#000" d="
      M 204 64 L 820 64
      A 40 40 0 0 0 780 104
      L 780 191
      A 127 127 0 0 1 653 318
      L 371 318
      A 127 127 0 0 1 244 191
      L 244 104
      A 40 40 0 0 0 204 64 Z"/>

    <!-- Inside: the cover on the left, the visualizer on the right. -->
    <circle cx="371" cy="191" r="68" fill="url(#cover)"/>
    <g fill="#FFFFFF">
      <rect x="590" y="166" width="26" height="50" rx="13"/>
      <rect x="633" y="130" width="26" height="122" rx="13"/>
      <rect x="676" y="151" width="26" height="80" rx="13"/>
    </g>
  </g>
</svg>
  <text x="440" y="262" font-family="Segoe UI Variable Display, Segoe UI, system-ui, sans-serif" font-weight="600" font-size="196" letter-spacing="-5" fill="#000000">HoverPill</text>
</svg>